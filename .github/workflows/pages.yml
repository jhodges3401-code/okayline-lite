name: Publish status page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    # Runs in your copy. Skipped in the source repo until Pages is enabled there (repo variable PAGES_ENABLED=true).
    if: github.repository != 'jhodges3401-code/okayline-lite' || vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
